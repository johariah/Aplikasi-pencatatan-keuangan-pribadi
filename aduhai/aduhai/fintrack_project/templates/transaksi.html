
<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Transaksi</title>

<script src="https://cdn.tailwindcss.com"></script>

<style>

body{
background:#f1f5f9;
font-family:Arial;
}

.card{
background:white;
border-radius:25px;
padding:25px;
box-shadow:0 10px 30px rgba(0,0,0,.1);
}

.input{
width:100%;
padding:15px;
border:1px solid #ddd;
border-radius:15px;
margin-bottom:15px;
}

.btn{
width:100%;
padding:15px;
border:none;
border-radius:15px;
background:linear-gradient(
90deg,
#7c3aed,
#4f46e5
);
color:white;
font-size:18px;
cursor:pointer;
}

.btn:hover{
transform:scale(1.02);
}

</style>

</head>
<body>

<div class="max-w-6xl mx-auto p-6">

<div class="flex justify-between mb-6">

<h1 class="text-3xl font-bold">
</h1>

<div class="grid lg:grid-cols-3 gap-6">

<div class="bg-white rounded-3xl p-6 shadow">

<h3 class="font-bold mb-4">➕ Tambah Transaksi</h3>

<form method="POST">
{% csrf_token %}

<input type="text" name="title" placeholder="Nama Transaksi"
class="w-full border p-3 rounded-xl mb-3">

<input type="number" name="amount" placeholder="Nominal"
class="w-full border p-3 rounded-xl mb-3">

<select name="type" class="w-full border p-3 rounded-xl mb-3">
<option value="pemasukan">Pemasukan</option>
<option value="pengeluaran">Pengeluaran</option>
</select>

<select name="category" class="w-full border p-3 rounded-xl mb-3">
<option value="🍔 Makanan">🍔 Makanan</option>
<option value="🚗 Transportasi">🚗 Transportasi</option>
<option value="🎬 Hiburan">🎬 Hiburan</option>
<option value="🛒 Belanja">🛒 Belanja</option>
<option value="💡 Tagihan">💡 Tagihan</option>
<option value="💼 Gaji">💼 Gaji</option>
</select>

<button class="w-full bg-indigo-600 text-white p-3 rounded-xl">
Simpan
</button>
</form>

<div class="mt-6">
<canvas id="expenseChart"></canvas>
</div>

</div>

<div class="lg:col-span-2 bg-white p-6 rounded-3xl shadow">

<div class="flex flex-wrap gap-2 justify-between mb-4">
<h3 class="font-bold">📋 Riwayat Transaksi</h3>
