{% load static %}
<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Budget - FinTrack</title>

<script src="https://cdn.tailwindcss.com"></script>

<style>
body{
    background: linear-gradient(135deg,#4f46e5,#7c3aed);
}
.card{
    animation: fadeIn 0.5s ease;
}
@keyframes fadeIn{
    from{
        opacity:0;
        transform:translateY(20px);
    }
    to{
        opacity:1;
        transform:translateY(0);
    }
}
</style>

</head>
<body>

<div class="container mx-auto p-6">

<div class="flex justify-between items-center mb-8">
<h1 class="text-4xl font-bold text-white">
📊 Budget Bulanan
</h1>

<a href="{% url 'dashboard' %}"
class="bg-white text-indigo-600 px-5 py-3 rounded-xl font-bold shadow">
← Dashboard
</a>
</div>

<div class="bg-white rounded-3xl shadow-xl p-6 card">

<h2 class="text-2xl font-bold mb-5">
➕ Tambah Budget
</h2>

<form method="POST" action="{% url 'buat_budget' %}" class="grid md:grid-cols-2 gap-4">

{% csrf_token %}

<select name="category"
class="border p-4 rounded-xl">

<option value="🍔 Makanan">🍔 Makanan</option>
<option value="🚗 Transportasi">🚗 Transportasi</option>
<option value="🎬 Hiburan">🎬 Hiburan</option>
<option value="🛒 Belanja">🛒 Belanja</option>
<option value="💡 Tagihan">💡 Tagihan</option>
<option value="🏠 Rumah">🏠 Rumah</option>

</select>

<input
type="number"
name="amount"
placeholder="Jumlah Budget"
class="border p-4 rounded-xl">

<input
type="hidden"
name="month"
value="6">

<input
type="hidden"
name="year"
value="2026">

<button
class="md:col-span-2 bg-indigo-600 text-white p-4 rounded-xl hover:bg-indigo-700 transition">

💾 Simpan Budget

</button>

</form>

</div>

<div class="bg-white rounded-3xl shadow-xl p-6 mt-8 card">

<h2 class="text-2xl font-bold mb-5">
📋 Daftar Budget
</h2>

{% for b in budgets %}

<div class="border rounded-2xl p-4 mb-3 flex justify-between items-center">

<div>
<h3 class="font-bold text-lg">
{{ b.category }}
</h3>
<p class="text-gray-500">
Budget Bulanan
</p>
</div>

<div class="text-right">
<p class="font-bold text-indigo-600 text-xl">
Rp {{ b.amount }}
</p>
</div>

</div>

{% empty %}

<div class="text-center py-10">

<h3 class="text-xl font-bold text-gray-600">
Belum ada budget
</h3>

<p class="text-gray-400">
Silakan tambahkan budget pertama Anda
</p>

</div>

{% endfor %}

</div>

</div>

</body>
</html>
