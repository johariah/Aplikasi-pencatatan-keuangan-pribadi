<!DOCTYPE html>
{% load static %}
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Metode Pembayaran - KFC Project</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Arial', sans-serif;
            color: #fff;
            background: url("{% static 'main/images/metode3.jpeg' %}") center/cover fixed;
        }
        .overlay {
            background-color: rgba(0,0,0,0.7);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 30px;
        }
        h1 {
            font-size: 3rem;
            margin-bottom: 20px;
            text-align: center;
        }
        .payment-box {
            background-color: rgba(0,0,0,0.8);
            padding: 40px;
            border-radius: 15px;
            text-align: center;
            max-width: 500px;
            width: 100%;
        }
        .payment-box h2 {
            margin-bottom: 20px;
            font-size: 2rem;
        }
        .payment-option {
            background: rgba(255,255,255,0.1);
            margin: 10px 0;
            padding: 15px;
            border-radius: 10px;
            cursor: pointer;
            transition: background 0.3s, transform 0.3s;
            text-decoration: none;
            color: white;
            display: block;
        }
        .payment-option:hover {
            background: rgba(255,255,255,0.3);
            transform: scale(1.02);
        }
        .payment-option span {
            font-size: 1.5rem;
            display: block;
        }
    </style>
</head>
<body>
    <div class="overlay">
        <h1>Pilih Metode Pembayaran</h1>
        <div class="payment-box">
            <h2>Metode yang Tersedia</h2>

            <a class="payment-option" href="{% url 'payment_bank' %}">
                <span>Transfer Bank</span>
            </a>

            <a class="payment-option" href="{% url 'payment_credit' %}">
                <span>Kartu Kredit/Debit</span>
            </a>

            <a class="payment-option" href="{% url 'payment_ewallet' %}">
                <span>E-Wallet (OVO/Gopay/Dana)</span>
            </a>

            <a class="payment-option" href="{% url 'payment_cod' %}">
                <span>Bayar di Tempat (COD)</span>
            </a>
        </div>
    </div>
</body>
</html>
