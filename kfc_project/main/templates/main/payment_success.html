<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Pembayaran Berhasil - KFC Project</title>
    <style>
        body { margin:0; padding:0; font-family:'Arial',sans-serif; color:#fff; background:#222; }
        .container { min-height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:30px; }
        .box { background:#4caf50; padding:40px; border-radius:15px; max-width:500px; width:100%; text-align:center; }
        h1 { font-size:2.5rem; margin-bottom:20px; }
        p { font-size:1.2rem; }
    </style>
</head>
<body>
    <div class="container">
        <div class="box">
            <h1>Pembayaran Berhasil!</h1>
            <p>Terima kasih atas pesanan Anda.<br>Pesanan Anda sedang diproses.</p>
        </div>
    </div>
</body>
</html>
