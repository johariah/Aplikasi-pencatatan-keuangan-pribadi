<!DOCTYPE html>
{% load static %}
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Checkout KFC Project</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Arial', sans-serif;
            color: #fff;
            background: url("{% static 'main/images/metode3.jpeg' %}") center/cover fixed;
        }
        .overlay {
            background-color: rgba(0,0,0,0.7);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 30px;
        }
        h1 {
            font-size: 3rem;
            margin-bottom: 20px;
            text-align: center;
        }
        .checkout-box {
            background-color: rgba(0,0,0,0.8);
            padding: 40px;
            border-radius: 15px;
            text-align: center;
            max-width: 400px;
            width: 100%;
        }
        .checkout-box h2 {
            margin-bottom: 15px;
            font-size: 2rem;
        }
        .checkout-box p {
            font-size: 1.5rem;
            margin: 10px 0;
        }
        .checkout-box .total {
            color: #ffeb3b;
            font-weight: bold;
            font-size: 1.8rem;
        }
        .checkout-box button {
            background: #ff0000;
            border: none;
            color: #fff;
            padding: 12px 25px;
            border-radius: 8px;
            font-size: 1.2rem;
            cursor: pointer;
            margin-top: 20px;
            transition: background 0.3s, transform 0.3s;
        }
        .checkout-box button:hover {
            background: #ff4d4d;
            transform: scale(1.05);
        }
    </style>
</head>
<body>
    <div class="overlay">
        <h1>Checkout Pesanan Anda</h1>
        <div class="checkout-box">
            <h2>{{ item }}</h2>
            <p>Harga: <span class="total">Rp {{ price }}</span></p>
            <button onclick="window.location.href='{% url 'payment' %}'">Bayar Sekarang</button>
        </div>
    </div>
</body>
</html>
