<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daftar Akun - FinTrack</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 flex items-center justify-center min-h-screen p-4">
    <div class="bg-white p-8 rounded-2xl shadow-md w-full max-w-md border border-gray-100">
        <div class="text-center mb-6">
            <span class="text-3xl">🚀</span>
            <h2 class="text-2xl font-bold text-indigo-600 mt-2">Mulai Akun Baru</h2>
            <p class="text-gray-400 text-sm mt-1">Kelola finansial pribadi Anda dengan lebih teratur.</p>
        </div>
        
        {% if error %}
        <div class="bg-red-50 text-red-600 p-3 rounded-xl mb-4 text-xs font-medium text-center border border-red-100">{{ error }}</div>
        {% endif %}

        <form method="POST" class="space-y-4">
            {% csrf_token %}
            <div>
                <label class="block text-xs font-semibold text-gray-500 uppercase mb-1">Username</label>
                <input type="text" name="username" placeholder="Buat username unik" class="w-full px-4 py-2.5 border border-gray-200 rounded-xl text-sm focus:outline-none focus:border-indigo-500" required>
            </div>
            <div>
                <label class="block text-xs font-semibold text-gray-500 uppercase mb-1">Alamat Email</label>
                <input type="email" name="email" placeholder="nama@email.com" class="w-full px-4 py-2.5 border border-gray-200 rounded-xl text-sm focus:outline-none focus:border-indigo-500" required>
            </div>
            <div>
                <label class="block text-xs font-semibold text-gray-500 uppercase mb-1">Password</label>
                <input type="password" name="password" placeholder="Minimal 8 karakter" class="w-full px-4 py-2.5 border border-gray-200 rounded-xl text-sm focus:outline-none focus:border-indigo-500" required>
            </div>
            <div>
                <label class="block text-xs font-semibold text-gray-500 uppercase mb-1">Konfirmasi Password</label>
                <input type="password" name="password_konfirmasi" placeholder="Ulangi password Anda" class="w-full px-4 py-2.5 border border-gray-200 rounded-xl text-sm focus:outline-none focus:border-indigo-500" required>
            </div>
            <button type="submit" class="w-full py-3 bg-indigo-600 text-white font-medium rounded-xl text-sm hover:bg-indigo-700 transition shadow-sm mt-2">
                Daftar & Masuk Dashboard
            </button>
        </form>

        <div class="mt-6 text-center text-sm text-gray-500">
            Sudah memiliki akun? <a href="{% url 'login' %}" class="text-indigo-600 hover:underline font-semibold">Log In di sini</a>
        </div>
    </div>
</body>
</html>
